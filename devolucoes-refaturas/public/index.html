<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Devoluções e Refaturas da Filial (Copy)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: faixa de resumo no topo, quadro em 5 colunas (uma por setor, na ordem do processo), ficha lateral do caso. */
:root{
  --bg:#eef1f5; --surface:#ffffff; --surface-2:#f6f8fa; --ink:#15202c; --muted:#5a6778; --line:#d6dde6;
  --accent:#1f4fd1; --accent-ink:#ffffff;
  --s-log:#b25a06; --s-com:#1f4fd1; --s-oco:#c0183f; --s-pro:#6b2fd6; --s-ok:#177a3c;
  --warn:#a85d00; --warn-bg:#fff1d6; --crit:#b3122f; --crit-bg:#ffe1e6; --ok-bg:#dff5e6;
  --shadow:0 1px 2px rgba(20,32,44,.06),0 2px 8px rgba(20,32,44,.05);
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f141b; --surface:#171e27; --surface-2:#1d2631; --ink:#e7edf4; --muted:#97a4b5; --line:#2b3644;
    --accent:#6e94ff; --accent-ink:#0c1320;
    --s-log:#f0a04b; --s-com:#7d9dff; --s-oco:#ff6b8a; --s-pro:#b28cff; --s-ok:#4fd187;
    --warn:#f5b453; --warn-bg:#3a2a10; --crit:#ff7a93; --crit-bg:#3d1520; --ok-bg:#15301f;
    --shadow:0 1px 2px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#171e27; --surface-2:#1d2631; --ink:#e7edf4; --muted:#97a4b5; --line:#2b3644;
  --accent:#6e94ff; --accent-ink:#0c1320;
  --s-log:#f0a04b; --s-com:#7d9dff; --s-oco:#ff6b8a; --s-pro:#b28cff; --s-ok:#4fd187;
  --warn:#f5b453; --warn-bg:#3a2a10; --crit:#ff7a93; --crit-bg:#3d1520; --ok-bg:#15301f;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--body);display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}

/* Topo */
header.topo{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:14px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.marca{display:flex;flex-direction:column;gap:0;min-width:0}
.marca h1{font:700 24px/1.05 var(--display);letter-spacing:.01em;margin:0;text-wrap:balance}
.marca small{color:var(--muted);font-size:12px}
.vivo{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:3px 9px;border:1px solid var(--line);border-radius:99px;white-space:nowrap}
.vivo i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.vivo.on i{background:var(--s-ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--s-ok) 25%,transparent)}
.vivo.erro i{background:var(--crit)}
.espaco{flex:1}
.campo-topo{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.filtros{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.acomp-topo{font-size:12px;color:var(--muted);margin-bottom:8px}
.campo-topo select,.busca{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--ink)}
.busca{width:min(280px,100%)}
.eu{font-size:13px;color:var(--muted);white-space:nowrap}
.eu b{color:var(--ink);font-weight:600}

/* Resumo */
.resumo{display:flex;flex-wrap:wrap;gap:10px;padding:14px 20px 0}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:136px;flex:1 1 136px}
.kpi span{display:block;font-size:12px;color:var(--muted)}
.kpi b{font:700 26px/1.1 var(--display);font-variant-numeric:tabular-nums}
.kpi.alerta b{color:var(--crit)}
.barra{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 20px}
.abas{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.abas button{border:0;background:none;padding:7px 14px;cursor:pointer;color:var(--muted)}
.abas button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.perigo{color:var(--crit)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.peq{padding:4px 9px;font-size:12px}

/* Quadro */
main{flex:1;min-height:0;display:flex;flex-direction:column}
.quadro{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(250px,1fr));gap:12px;padding:0 20px 20px;overflow-x:auto}
.coluna{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;border-top:4px solid var(--cor)}
.coluna.minha{box-shadow:0 0 0 2px var(--cor)}
.col-cab{padding:10px 12px 8px;display:flex;flex-direction:column;gap:2px;border-bottom:1px solid var(--line)}
.col-cab .l1{display:flex;align-items:center;gap:8px}
.col-cab h2{font:700 19px/1.1 var(--display);margin:0;color:var(--cor);letter-spacing:.02em;text-transform:uppercase}
.col-cab .qtd{margin-left:auto;font:600 13px var(--body);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:1px 9px;font-variant-numeric:tabular-nums}
.col-cab p{margin:0;font-size:12px;color:var(--muted)}
.tag-fila{font-size:11px;font-weight:600;color:var(--cor);border:1px solid var(--cor);border-radius:99px;padding:0 7px}
.col-corpo{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.vazio{color:var(--muted);font-size:12px;text-align:center;padding:18px 6px}
.cartao{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--cor);border-radius:8px;padding:9px 10px;cursor:pointer;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:5px;text-align:left;width:100%}
.cartao:hover{border-color:var(--muted);border-left-color:var(--cor)}
.cartao .l1{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cartao .cod{font:500 12px var(--mono);color:var(--muted)}
.cartao .cli{font-weight:600;font-size:14px;line-height:1.25;overflow-wrap:anywhere}
.cartao .meta{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.cartao .meta b{color:var(--ink);font-weight:500}
.cartao .rod{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;border-radius:99px;padding:1px 8px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.pill.crit{background:var(--crit-bg);color:var(--crit);border-color:transparent}
.pill.ok{background:var(--ok-bg);color:var(--s-ok);border-color:transparent}
.pill.ex{border-style:dashed}
.motivo{font-size:11px;font-weight:500;padding:1px 7px;border-radius:4px;background:color-mix(in srgb,var(--s-log) 13%,transparent);color:var(--s-log)}

/* Lista */
.lista-wrap{flex:1;min-height:0;overflow:auto;padding:0 20px 20px}
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:13px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
th{font-weight:600;color:var(--muted);font-size:12px;background:var(--surface-2);position:sticky;top:0}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
.etq{display:inline-block;font-size:11px;font-weight:600;padding:1px 8px;border-radius:99px;color:var(--cor);border:1px solid var(--cor)}
.pc-set{display:flex;gap:4px;flex-wrap:wrap}
.pc-td{white-space:normal!important;min-width:170px}
.pe.crit{color:var(--crit);font-weight:600}
.pe.warn{color:var(--warn);font-weight:600}
.pc{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pc-ok{border-color:color-mix(in srgb,var(--s-ok) 45%,var(--line));color:var(--s-ok)}
.pc-at{border-color:var(--accent);color:var(--accent);font-weight:600}
.pc-agu{border-color:var(--warn);color:var(--warn);font-weight:600}
.pc-pen{opacity:.55}

/* Ficha lateral */
.veu{position:fixed;inset:0;background:rgba(10,16,24,.38);z-index:20;display:none}
.veu.on{display:block}
aside.ficha{position:fixed;top:0;right:0;bottom:0;width:min(720px,100%);background:var(--bg);z-index:21;display:none;flex-direction:column;border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.12)}
aside.ficha.on{display:flex}
.f-cab{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;flex-direction:column;gap:10px}
.f-cab .l1{display:flex;align-items:flex-start;gap:12px}
.f-cab h2{font:700 24px/1.1 var(--display);margin:0;overflow-wrap:anywhere}
.f-cab .sub{font-size:12px;color:var(--muted)}
.fechar{margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:18px;line-height:1;flex:none}
.trilha{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.trilha div{font-size:11px;font-weight:600;text-align:center;padding:5px 2px 0;border-top:4px solid var(--line);color:var(--muted)}
.trilha div.feito{border-top-color:var(--cor);color:var(--ink)}
.trilha div.atual{border-top-color:var(--cor);color:var(--cor)}
.f-corpo{flex:1;overflow-y:auto;padding:14px 18px 30px;display:flex;flex-direction:column;gap:12px}
details.secao{background:var(--surface);border:1px solid var(--line);border-radius:10px;border-left:4px solid var(--cor)}
details.secao.atual{box-shadow:0 0 0 2px color-mix(in srgb,var(--cor) 45%,transparent)}
details.secao>summary{list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px}
details.secao>summary::-webkit-details-marker{display:none}
summary .n{font:700 13px var(--mono);color:var(--cor);border:1.5px solid var(--cor);border-radius:50%;width:24px;height:24px;display:grid;place-items:center;flex:none}
summary h3{margin:0;font:700 18px/1.1 var(--display);letter-spacing:.02em;text-transform:uppercase}
summary .st{margin-left:auto}
summary .tarefa{font-size:12px;color:var(--muted)}
.sec-corpo{padding:2px 14px 14px;display:flex;flex-direction:column;gap:12px}
.aviso-fut{font-size:12px;color:var(--muted);background:var(--surface-2);border-radius:6px;padding:7px 10px}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.grade .w2{grid-column:1/-1}
.c label{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:3px}
.c label .req{color:var(--crit)}
.c input[type=text],.c input[type=date],.c select,.c textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:7px 9px}
.c textarea{min-height:62px;resize:vertical}
.c.erro input,.c.erro select,.c.erro textarea,.c.erro .chk{border-color:var(--crit);background:var(--crit-bg)}
.chk{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:var(--surface-2);cursor:pointer;font-weight:500}
.chk input{width:18px;height:18px;accent-color:var(--s-ok)}
.acoes{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.acoes .dir{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.motivo-volta{display:flex;gap:8px;width:100%}
.motivo-volta input{flex:1;background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:6px 9px}
.email{border:1px dashed var(--line);border-radius:8px;padding:10px;background:var(--surface-2);display:flex;flex-direction:column;gap:8px}
.email .t{font-size:12px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px}
.email textarea{width:100%;min-height:220px;font:12.5px/1.5 var(--mono);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px;resize:vertical}
.bloco{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.bloco h3{margin:0;font:700 16px var(--display);letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
.msgs{display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:9px}
.msg img{width:28px;height:28px;border-radius:50%;flex:none}
.msg .q{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.msg .q b{color:var(--ink);font-weight:600}
.msg p{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.novo-msg{display:flex;gap:8px;align-items:flex-end}
.novo-msg textarea{flex:1;min-height:40px;background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:7px 9px;resize:vertical}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.hist li{display:flex;gap:8px;align-items:baseline}
.hist time{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;min-width:92px}
.chip-setor{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--cor)}
.grupo{grid-column:1/-1;font:600 11.5px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--cor);padding-top:6px;border-top:1px dashed var(--line);margin-top:2px}
.grupo:first-child{border-top:0;padding-top:0;margin-top:0}
.c.lido input,.c.lido select,.c.lido textarea{background:color-mix(in srgb,var(--s-ok) 12%,var(--surface-2));border-color:color-mix(in srgb,var(--s-ok) 55%,var(--line))}
.anx-botoes{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.anx-dica{font-size:12px;color:var(--muted);flex:1 1 220px}
.anx-status{font-size:13px;padding:8px 10px;border-radius:7px;background:var(--surface-2);display:flex;gap:8px;align-items:center}
.anx-status.ok{background:var(--ok-bg);color:var(--s-ok)}
.anx-status.erro{background:var(--crit-bg);color:var(--crit)}
.giro{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:giro .8s linear infinite;flex:none}
@keyframes giro{to{transform:rotate(360deg)}}
.anx-docs{display:flex;flex-direction:column;gap:6px}
.anx-doc{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:13px}
.anx-doc .tp{font:600 10.5px var(--mono);border:1px solid var(--s-log);color:var(--s-log);border-radius:4px;padding:1px 5px}
.anx-doc a{color:var(--accent);overflow-wrap:anywhere}
.anx-doc .q{color:var(--muted);font-size:12px;margin-left:auto;white-space:nowrap}
.anx-fotos{display:flex;flex-wrap:wrap;gap:8px}
.anx-foto{position:relative;width:96px;height:96px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2)}
.anx-foto img{width:100%;height:100%;object-fit:cover;display:block}
.rm{border:0;background:rgba(10,16,24,.65);color:#fff;border-radius:50%;width:22px;height:22px;cursor:pointer;line-height:1;font-size:14px}
.anx-foto .rm{position:absolute;top:4px;right:4px}
.anx-doc .rm{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
fieldset.trava{border:0;padding:0;margin:0;min-width:0}
fieldset.trava:disabled input,fieldset.trava:disabled select,fieldset.trava:disabled textarea,fieldset.trava:disabled .chk{cursor:not-allowed;color:var(--ink);opacity:.8}
.aviso-fut.bloq{background:var(--warn-bg);color:var(--warn)}
.nota-setor{font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:6px;padding:7px 10px;flex:1}
.anx-email{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;align-items:center}
.chk-mini{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.chk-mini input{accent-color:var(--accent)}
.passo{font-size:12.5px;background:var(--ok-bg);color:var(--s-ok);border-radius:6px;padding:8px 10px}
.passo a{color:inherit;font-weight:600}
.f-rod{border-top:1px solid var(--line);background:var(--surface);padding:10px 18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}

/* Acessos */
.acx{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.acx .l1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.acx .l1 b{font-size:14px}
.acx .ids{font-size:11px;color:var(--muted)}
.acx .setores{display:flex;flex-wrap:wrap;gap:6px 14px}
.acx .pe{font-size:11.5px;color:var(--muted)}
.acx input[type=text]{flex:1 1 240px;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:7px 9px}
.and-lista{display:flex;flex-direction:column;gap:6px}
.and-linha{display:flex;align-items:center;gap:8px;font-size:13px;padding:5px 9px;border-left:3px solid var(--cor);border-radius:6px;background:var(--surface-2);flex-wrap:wrap}
.and-linha.fraco{opacity:.6}
.and-linha .and-nome{font-weight:600;min-width:96px}
.and-linha .and-tempo{color:var(--muted);font-size:12px;min-width:70px}
.and-total{font-size:12.5px;color:var(--muted);padding-top:2px}
.motivo-volta select{background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:6px 9px}
.acoes select{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:7px 9px}

/* Avisos */
.faixa{margin:12px 20px 0;padding:10px 14px;border-radius:8px;background:var(--warn-bg);color:var(--warn);font-size:13px;display:none}
.faixa.on{display:block}
.toasts{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:40;width:min(460px,calc(100% - 32px))}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast.erro{background:var(--crit);color:#fff}

@media (max-width:720px){
  header.topo{padding:12px 16px}
  .resumo,.barra{padding-left:16px;padding-right:16px}
  .quadro{padding:0 16px 16px;grid-template-columns:repeat(4,minmax(260px,82vw))}
  .lista-wrap{padding:0 16px 16px}
  .grade{grid-template-columns:1fr}
  .kpi{min-width:130px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="topo">
  <div class="marca">
    <h1>Devoluções e Refaturas</h1>
    <small>Ocorrências da filial · Logística → Comercial → Ocorrência → Processos</small>
  </div>
  <span class="vivo" id="vivo"><i></i><span id="vivo-txt">Conectando…</span></span>
  <div class="espaco"></div>
  <button class="btn" type="button" id="acessos-bt" hidden>Acessos</button>
  <label class="campo-topo" for="setor" title="Destaca sua fila no quadro; não altera suas permissões.">Ver setor

const SECOES = ["logistica","comercial","ocorrencia","processos"];

/* ---------- Utilidades ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const esc = v => String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const agoraISO = ()=>new Date().toISOString();
const hojeYMD = ()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const BRL = new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
const fmtMoeda = n => (typeof n==="number" && isFinite(n)) ? BRL.format(n) : "";
const fmtNum = n => (typeof n==="number" && isFinite(n)) ? n.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}) : "";
function lerMoeda(s){ s=String(s||"").replace(/[^\d,.-]/g,""); if(!s) return null; if(s.includes(",")) s=s.replace(/\./g,"").replace(",","."); const n=parseFloat(s); return isFinite(n)?n:null; }
function fmtData(ymd){ if(!ymd||typeof ymd!=="string") return ""; const m=ymd.match(/^(\d{4})-(\d{2})-(\d{2})/); return m?`${m[3]}/${m[2]}/${m[1]}`:""; }
function fmtQuando(iso){ if(!iso) return ""; const d=new Date(iso); if(isNaN(d)) return ""; const hoje=new Date(); const mesmoDia=d.toDateString()===hoje.toDateString(); const hm=d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}); return mesmoDia?("hoje "+hm):(d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})+" "+hm); }
function diasDesde(iso){ if(!iso) return 0; const t=new Date(iso).getTime(); if(isNaN(t)) return 0; return Math.max(0,Math.floor((Date.now()-t)/86400000)); }
function chave(){ return Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,7); }
function novoCodigo(){ const d=new Date(); const y=String(d.getFullYear()).slice(2); const ab="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let r=""; for(let i=0;i<3;i++) r+=ab[Math.floor(Math.random()*ab.length)]; return `DEV-${y}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}-${r}`; }
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function toast(msg, erro){ const t=document.createElement("div"); t.className="toast"+(erro?" erro":""); if(typeof msg==="string") t.textContent=msg; else t.appendChild(msg); $("#toasts").appendChild(t); setTimeout(()=>t.remove(), erro?7000:4500); return t; }
function pessoa(uid){ return `<span data-uid="${esc(uid||"")}">${uid?"…":"Exemplo"}</span>`; }

/* ---------- Runtime: artefato do claude.ai ou modo demonstração ---------- */
let RT = null;
try{ if(typeof claude !== "undefined" && claude && typeof claude.use === "function") RT = claude; }catch(e){}
const MODO_DEMO = !RT;
if(!RT) RT = criarRuntimeDemo();

function criarRuntimeDemo(){
  const CHAVE = "dev-demo-v1", CHAVE_UID = "dev-demo-uid";
  let base = {casos:{}, acessos:{}, config:{}};
  try{ const s = localStorage.getItem(CHAVE); if(s){ const lido = JSON.parse(s); if(lido && typeof lido === "object") base = lido; } }catch(e){}
  if(!base.casos) base.casos = {};
  if(!base.acessos) base.acessos = {};
  if(!base.config) base.config = {};
  const ouvintes = {};
  let seq = 0;
  let uid = "";
  try{
    uid = localStorage.getItem(CHAVE_UID) || "";
    if(!uid){ uid = "demo_" + Math.random().toString(36).slice(2,8); localStorage.setItem(CHAVE_UID, uid); }
  }catch(e){ uid = "demo_local"; }
  function salvar(){
    try{ localStorage.setItem(CHAVE, JSON.stringify(base)); }
    catch(e){ toast("Modo demonstração: o navegador ficou sem espaço para salvar.", true); }
  }
  function fundir(dst, src){
    for(const k in src){
      const v = src[k], d = dst[k];
      if(v && typeof v === "object" && !Array.isArray(v) && d && typeof d === "object" && !Array.isArray(d)) dst[k] = fundir(Object.assign({}, d), v);
      else dst[k] = v;
    }
    return dst;
  }
  function retrato(col){
    const b = base[col] || {};
    return { metadata:{fromCache:false}, docChanges:()=>[], docs: Object.keys(b).map(id => ({ id:id, metadata:{hasPendingWrites:false}, data:()=>b[id] })) };
  }
  function avisar(col){ (ouvintes[col] || []).slice().forEach(fn => setTimeout(() => fn(retrato(col)), 0)); }
  const db = {
    collection: name => ({
      onSnapshot(cb){ (ouvintes[name] = ouvintes[name] || []).push(cb); setTimeout(() => cb(retrato(name)), 0); return () => {}; },
      doc(){
        const id = "c" + Date.now().toString(36) + (++seq);
        return {
          id: id,
          set: async v => { (base[name] = base[name] || {})[id] = v; salvar(); avisar(name); },
          update: async v => { const b = base[name] = base[name] || {}; b[id] = fundir(Object.assign({}, b[id] || {}), v); salvar(); avisar(name); },
          delete: async () => { delete (base[name] || {})[id]; salvar(); avisar(name); }
        };
      }
    }),
    doc: path => {
      const p = path.split("/"), name = p[0], id = p[1];
      return {
        set: async v => { (base[name] = base[name] || {})[id] = Object.assign({}, v); salvar(); avisar(name); },
        update: async v => { const b = base[name] = base[name] || {}; b[id] = fundir(Object.assign({}, b[id] || {}), v); salvar(); avisar(name); },
        delete: async () => { delete (base[name] || {})[id]; salvar(); avisar(name); }
      };
    }
  };
  const user = {
    me: async () => ({ id: uid, name: "Visitante (demo)", canEdit: true }),
    profiles: async ids => { const o = {}; ids.forEach(i => { o[i] = { name: i === uid ? "Você" : "Colega", avatarUrl: "" }; }); return o; },
    can: async () => true
  };
  const downloads = {
    save: async d => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(d.data);
      a.download = d.filename || "arquivo";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    }
  };
  const servicos = {db:db, user:user, downloads:downloads};
  return { use: async nome => { const s = servicos[nome]; if(!s) throw {code:"not_granted"}; return s; } };
}

  d.textContent = "Modo demonstração — os casos ficam salvos apenas neste navegador (localStorage), sem anexos e sem envio de e-mail. Para uso real, conecte o banco na Cloudflare (D1).";

}

let db=null, user=null, meId=null, assets=null, sample=null, sampleImgs=false;

function papelDe(d){ const p = (d && d.papel) || "membro"; return (p === "dono" || p === "gestor") ? p : "membro"; }

function calcularAcesso(){
  const d = acessos.get(meId) || null;
  const setores = (d && Array.isArray(d.setores) ? d.setores : []).filter(k => ROTULO_SETOR[k] && k !== "concluido");
  const dono = DONOS.indexOf(meId) >= 0 || papelDe(d) === "dono";
  meuAcesso = {uid:meId, nome:(d && d.nome) || meNome, setores:setores, dono:dono,
               papel: dono ? "dono" : papelDe(d), gestor: dono || papelDe(d) === "gestor"};
  if(setores.indexOf(setor) < 0) setor = setores[0] || "";

  aplicarRestricoes();

}

function montarSeletorSetor(){
  const sel = $("#setor");

    if(!meuAcesso.setores.length){
      sel.innerHTML = `<option value="">Sem setor liberado</option>`;
      sel.disabled = true;
    } else {
      sel.disabled = meuAcesso.setores.length === 1;
      sel.innerHTML = meuAcesso.setores.map(k => `<option value="${k}">${ROTULO_SETOR[k]}</option>`).join("");
      sel.value = setor;
    }
  }
  const eu = $("#eu");
  if(eu){
    const txt = meuAcesso.setores.length ? meuAcesso.setores.map(k => ROTULO_SETOR[k]).join(" / ") : "sem setor liberado";
    eu.innerHTML = "<b>" + esc(meuAcesso.nome || "você") + "</b> · " + esc(txt) + (meuAcesso.gestor ? " · gestor" : "");
  }
}

function aplicarRestricoes(){
  const novo = $("#novo"); if(novo) novo.hidden = !podeCriar();
  const bt = $("#acessos-bt"); if(bt) bt.hidden = !meuAcesso.gestor;
  const fx = $("#faixa-acesso"); if(!fx) return;
  fx.innerHTML = ""; fx.classList.remove("on");
  if(!meId || !acessoPronto) return;
  if(!acessos.size){
    fx.textContent = "Primeiro acesso: o painel ainda não tem administração definida. Quem assumir libera o acesso de cada setor. ";

      const b = document.createElement("button");
      b.type = "button"; b.className = "btn peq"; b.textContent = "Assumir a administração"; b.onclick = reivindicarAdmin;
      fx.appendChild(b);
    }
    fx.classList.add("on");
    return;
  }
  if(!meuAcesso.setores.length && !meuAcesso.dono){
    fx.textContent = "Seu usuário ainda não tem setor liberado. Você pode consultar os casos, mas não editar. ";
    const b = document.createElement("button");
    b.type = "button"; b.className = "btn peq"; b.textContent = "Pedir liberação"; b.onclick = pedirAcesso;
    fx.appendChild(b);
    fx.classList.add("on");
  }
}

function podeAgir(k){
  if(!meId) return {ok:false, msg:"Não identifiquei seu usuário. Abra o painel pela sua conta da empresa."};
  if(!acessoPronto) return {ok:false, msg:"Verificando seu acesso ao painel… tente de novo em instantes."};

    const meu = meuAcesso.setores.length ? meuAcesso.setores.map(x => ROTULO_SETOR[x]).join(" / ") : "somente leitura";
    return {ok:false, msg:`Esta etapa é do setor ${ROTULO_SETOR[k]}. Seu acesso é ${meu}.`};
  }
  return {ok:true};
}

/* ---------- Andamento por etapa: registros, tempos e retrabalho ---------- */
const SEMENTE = {ocorrencia:["dataAbertura"]};

function recShape(r){
  r = r || {};
  return {
    status: r.status || "pendente",
    iniciadoEm: r.iniciadoEm || null,
    entradaEm: r.entradaEm || null,
    encerradoEm: r.encerradoEm || null,
    devolvidoEm: r.devolvidoEm || null,

/* ---------- Nomes de pessoas ---------- */
async function resolverNomes(root){
  const spans=[...root.querySelectorAll("[data-uid]")];
  const ids=[...new Set(spans.map(s=>s.dataset.uid).filter(Boolean))];
  const faltando=ids.filter(id=>!cacheNomes[id]);
  let ps={};
  if(user && faltando.length){ try{ ps=await user.profiles(faltando); }catch(e){} }
  for(const id in ps) if(ps[id]&&ps[id].name) cacheNomes[id]=ps[id].name;
  for(const s of spans){ const id=s.dataset.uid; if(!id){ s.textContent="Exemplo"; continue; } s.textContent=cacheNomes[id]||"Alguém"; }
  root.querySelectorAll("img[data-av]").forEach(img=>{ const p=ps[img.dataset.av]; if(p&&p.avatarUrl) img.src=p.avatarUrl; });
}

  $("#resumo").innerHTML = k("Devoluções em aberto", abertos.length)

/* ---------- Acompanhamento caso a caso e finalizados ---------- */

/* ---------- Prazo por etapa (SLA) e gargalo ---------- */
let prazos = {logistica:1, comercial:2, ocorrencia:2, processos:2};

  if(!c || c.etapa === "concluido") return null;
  const p = prazoDaEtapa(c.etapa);
  if(!p) return null;
  const r = (c.etapas || {})[c.etapa] || {};
  const ini = msDe(r.entradaEm) || msDe(c.etapaDesde);
  if(ini == null) return null;
  return ini + p * 86400000;
}
function prazoDe(c){
  const venc = vencimentoDe(c);
  if(venc == null) return {txt:"", cls:"", dica:""};
  const dif = venc - Date.now();
  const horas = Math.ceil(Math.abs(dif) / 3600000);
  const dias = dif < 0 ? Math.floor(Math.abs(dif) / 86400000) : Math.ceil(Math.abs(dif) / 86400000);
  const p = prazoDaEtapa(c.etapa);
  const dica = "Prazo de " + p + " d em " + (ET[c.etapa] ? ET[c.etapa].nome : "etapa") + " · vence " + fmtDataHora(new Date(venc).toISOString());
  if(dif < 0) return {txt:(dias >= 1 ? dias + " d de atraso" : horas + " h de atraso"), cls:"crit", dica:dica};
  if(dif <= 86400000) return {txt:"vence em " + (horas >= 1 ? horas + " h" : "menos de 1 h"), cls:"warn", dica:dica};
  return {txt:"", cls:"", dica:dica};
}
function gargaloDe(){
  const abertos = casosFiltrados().filter(c => !finalizadoDe(c));
  const agoraT = Date.now();
  let melhor = null;
  for(const s of SECOES){
    const doSetor = abertos.filter(c => c.etapa === s);
    if(!doSetor.length) continue;
    let soma = 0, atrasados = 0;
    for(const c of doSetor){
      const r = (c.etapas || {})[s] || {};
      soma += tempoEtapa(r, agoraT);
      const v = vencimentoDe(c);
      if(v != null && v < agoraT) atrasados++;
    }
    const media = soma / doSetor.length;
    if(!melhor || media > melhor.media) melhor = {s:s, media:media, n:doSetor.length, atrasados:atrasados};
  }
  return melhor;
}
function percursoHTML(c){

    const ico = st === "concluida" ? "✓" : (st === "ativa" || st === "aguardando") ? "●" : "·";
    const dur = tempoEtapa(r, agoraT);
    const dev = r.devolucoes ? " ↺" + r.devolucoes : "";
    const dica = ET[s].nome + ": " + st + (dur ? " · " + fmtDur(dur) : "") + (r.aguardando ? " · " + (r.aguardando.motivo || "") : "");
    return `<span class="pc ${cls}" title="${esc(dica)}">${ico} ${esc(ET[s].nome)}${dur ? " " + esc(fmtDur(dur)) : ""}${dev}</span>`;
  }).join("");
}
function linhasAcomp(){
  return casosFiltrados().filter(c => !finalizadoDe(c))
    .filter(c => !filtroEtapa || c.etapa === filtroEtapa)
    .filter(c => {
      const d = diasDesde(c.etapaDesde), ag = !!aguardandoDe(c);
      if(filtroSit === "andamento") return !ag && d < 2;
      if(filtroSit === "aguardando") return ag;
      if(filtroSit === "parado2") return !ag && d >= 2;
      if(filtroSit === "parado4") return !ag && d >= 4;
      if(filtroSit === "retrabalho") return totalDevolucoes(c) > 0;
      if(filtroSit === "atrasado"){ const v = vencimentoDe(c); return v != null && v < Date.now(); }
      if(filtroSit === "vence"){ const v = vencimentoDe(c); return v != null && v >= Date.now() && (v - Date.now()) <= 86400000; }
      return true;
    })
    .sort((a,b) => (IDX[a.etapa] - IDX[b.etapa]) || String(a.etapaDesde).localeCompare(String(b.etapaDesde)));

function campoHTML(sec,f){
  if(f.grupo) return `<div class="grupo">${esc(f.grupo)}</div>`;
  const id=`f-${sec}-${f.k}`; const req=f.req||f.reqSe?` <span class="req" title="Obrigatório para concluir a etapa">*</span>`:"";

  let inp;
  if(f.t==="select") inp=`<select id="${id}"><option value="">Selecione…</option>${f.opts.map(o=>`<option>${esc(o)}</option>`).join("")}</select>`;
  else if(f.t==="area") inp=`<textarea id="${id}" rows="2"></textarea>`;
  else if(f.t==="date") inp=`<input type="date" id="${id}">`;
  else if(f.t==="datetime") inp=`<input type="datetime-local" id="${id}">`;
  else if(f.t==="money") inp=`<input type="text" inputmode="decimal" id="${id}" placeholder="0,00" class="num">`;
  else inp=`<input type="text" id="${id}"${f.mono?' class="mono"':""}>`;
  return `<div class="c${w}" data-campo="${f.k}"><label for="${id}">${esc(f.l)}${req}</label>${inp}</div>`;
}
function lerSecao(sec){
  const o={};
  for(const f of CAMPOS[sec]){ if(!f.k) continue; const el=document.getElementById(`f-${sec}-${f.k}`); if(!el) continue;
    if(f.t==="check") o[f.k]=el.checked; else if(f.t==="money") o[f.k]=lerMoeda(el.value); else o[f.k]=el.value.trim(); }
  return o;
}
function preencherSecao(sec,dados){
  dados=dados||{};
  for(const f of CAMPOS[sec]){ if(!f.k) continue; const el=document.getElementById(`f-${sec}-${f.k}`); if(!el) continue; const v=dados[f.k];
    if(f.t==="check") el.checked=!!v;
    else if(f.t==="money") el.value=fmtNum(v);
    else if(f.t==="select"){ const s=v==null?"":String(v); if(s && ![...el.options].some(o=>o.value===s)){ const op=document.createElement("option"); op.textContent=s; el.appendChild(op);} el.value=s; }
    else el.value=v==null?"":String(v); }
}

function tratarErro(e){

  else toast("Não foi possível salvar agora. Tente de novo em instantes.",true);

/* ---------- Guarda de escrita, concorrência e trilha ---------- */
const META_LIVRE = new Set(["resumoEnviadoEm","resumoEnviadoPara","resumoPreparadoEm","resumoPreparadoPara","emailEnviadoEm","emailEnviado"]);
const ZERO_H = "000000000000000000000000";
const secoesDoPatch = p => SECOES.filter(s => p[s] && typeof p[s] === "object" && !Array.isArray(p[s]));

function diffSecao(antes, depois){
  const a = antes || {}, out = {};
  const corta = v => (typeof v === "string" ? v.slice(0,160) : v);
  for(const k of Object.keys(depois || {})){
    if(JSON.stringify(a[k]) === JSON.stringify(depois[k])) continue;
    out[k] = {de: corta(a[k] === undefined ? null : a[k]), para: corta(depois[k])};
  }
  return out;
}

function autorizarEscrita(c, patch, codigo){
  if(!podeEscrever) return "Seu acesso a este painel é somente leitura.";
  if(!meuAcesso.setores.length) return "Seu usuário ainda não tem setor liberado. Peça a um gestor na tela Acessos.";
  for(const s of secoesDoPatch(patch)){
    const campos = Object.keys(patch[s]);
    const permitidos = new Set(CAMPOS[s].filter(f => f.k).map(f => f.k));
    const fora = campos.filter(k => !permitidos.has(k) && !META_LIVRE.has(k));
    if(fora.length) return "Campo não previsto em " + ROTULO_SETOR[s] + ": " + fora.join(", ") + ".";
    if(codigo === "avancar" && patch.etapa === s && campos.every(k => (SEMENTE[s] || []).indexOf(k) >= 0)) continue;
    if(campos.every(k => META_LIVRE.has(k))){
      if(!meuAcesso.setores.includes(s) || IDX[c.etapa] < IDX[s]) return "Só " + ROTULO_SETOR[s] + " atualiza esses registros.";
      continue;
    }
    if(c.etapa !== s) return "A etapa " + ROTULO_SETOR[s] + " não está aberta: o caso está em " + ROTULO_SETOR[c.etapa] + ".";
    const pa = podeAgir(s); if(!pa.ok) return pa.msg;
  }
  if(patch.etapas){
    if(["avancar","devolver","reabrir","aguardar"].indexOf(codigo) < 0) return "Mudança de andamento só pelo fluxo do processo.";
    if(codigo === "reabrir"){
      if(!meuAcesso.gestor) return "Só um gestor reabre um caso encerrado.";
    } else {
      const pa = podeAgir(c.etapa); if(!pa.ok) return pa.msg;
    }
    const proj = etapaAtual({etapas:patch.etapas});
    if(proj !== (patch.etapa || c.etapa)) return "O andamento gravado não corresponde à etapa informada.";
  }
  if("finalizado" in patch){
    const okFim = (codigo === "avancar" && patch.etapa === "concluido") || (codigo === "reabrir" && meuAcesso.gestor);
    if(!okFim) return "O encerramento do caso só acontece ao concluir Processos.";
  }
  if(patch.etapa && patch.etapa !== c.etapa){
    if(codigo === "reabrir"){
      if(!meuAcesso.gestor) return "Só um gestor reabre um caso encerrado.";
      if(SECOES.indexOf(patch.etapa) < 0) return "Etapa de reabertura inválida.";
    } else {
      if(codigo !== "avancar" && codigo !== "devolver") return "Mudança de etapa só pelo fluxo: concluir a etapa ou devolver para outra etapa.";
      const pa = podeAgir(c.etapa); if(!pa.ok) return pa.msg;
      if(codigo === "avancar"){
        const prox = ETAPAS[IDX[c.etapa] + 1];
        if(!prox || patch.etapa !== prox.k) return "Só é possível avançar para a próxima etapa.";
      } else if(!(IDX[patch.etapa] < IDX[c.etapa])){
        return "Só é possível devolver para uma etapa anterior.";
      }
    }
  }
  if(patch.anexos){
    for(const k of Object.keys(patch.anexos)){
      const novo = patch.anexos[k], velho = (c.anexos || {})[k];
      const dono = TIPOS_PROC.has((novo && novo.tipo) || (velho && velho.tipo)) ? "processos" : "logistica";
      if(!meuAcesso.setores.includes(dono)) return "Só " + ROTULO_SETOR[dono] + " mexe nesses arquivos.";
      if(c.etapa !== dono) return "Arquivos de " + ROTULO_SETOR[dono] + " só podem ser alterados na etapa dele.";
    }
  }
  if(codigo === "excluir" && !meuAcesso.gestor) return "Só um gestor exclui casos.";
  return null;
}

async function hashTexto(t){
  try{
    const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t));
    return [...new Uint8Array(b)].slice(0,12).map(x => x.toString(16).padStart(2,"0")).join("");
  }catch(e){
    let h = 2166136261;
    for(let i = 0; i < t.length; i++){ h ^= t.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
    return ("00000000" + h.toString(16)).slice(-8);
  }
}
const eventosTrilha = c => Object.entries(c.trilha || {})
  .filter(([,e]) => e && typeof e === "object" && e.seq != null)
  .map(([id,e]) => Object.assign({id:id}, e))
  .sort((a,b) => a.seq - b.seq);
const corpoEvento = e => JSON.stringify([e.seq,e.em,e.por,e.setor,e.codigo,e.acao,e.antes||null,e.depois||null]);

async function novoEvento(c, base){
  const l = eventosTrilha(c), ult = l[l.length-1] || null;
  const e = Object.assign({}, base, {seq:(ult ? ult.seq : 0) + 1, hp: ult ? ult.h : ZERO_H});
  e.h = await hashTexto(e.hp + "|" + corpoEvento(e));
  return e;
}

async function conferirTrilha(c){
  const l = eventosTrilha(c);
  let hp = ZERO_H, esperado = 1;
  for(const e of l){
    if(e.seq !== esperado) return {ok:false, n:l.length, motivo:"evento " + e.seq + " fora de sequência"};
    if(e.hp !== hp) return {ok:false, n:l.length, motivo:"elo perdido no evento " + e.seq};
    if((await hashTexto(hp + "|" + corpoEvento(e))) !== e.h) return {ok:false, n:l.length, motivo:"conteúdo do evento " + e.seq + " não confere"};
    hp = e.h; esperado++;
  }
  return {ok:true, n:l.length, cabeca:hp};
}

let baseEscrita = null;
const assinatura = c => JSON.stringify([c.etapa, c.logistica||{}, c.comercial||{}, c.ocorrencia||{}, c.processos||{}]);
function marcarBase(){
  if(Object.values(sujo).some(Boolean)) return;

  baseEscrita = c ? {id:aberto, etapa:c.etapa, assinatura:assinatura(c)} : null;

async function gravar(patch, rotulo, setorAcao, codigo){
  const id = aberto, c = casos.get(id);
  if(!c || !db) throw {code:"sem_caso"};
  const cod = codigo || "salvar";
  const negado = autorizarEscrita(c, patch, cod);
  if(negado){ toast(negado, true); throw {code:"negado"}; }
  if(cod !== "comentar" && cod !== "anexo" && baseEscrita && baseEscrita.id === id && baseEscrita.assinatura !== assinatura(c)){
    toast((nomeDe(c.atualizadoPor) || "Outra pessoa") + " alterou este caso enquanto você editava. Nada foi salvo. Feche e reabra a ficha para ver a versão atual.", true);
    throw {code:"conflito"};
  }
  const agora = agoraISO();
  const antes = {etapa:c.etapa}, depois = {etapa: patch.etapa || c.etapa};
  for(const s of secoesDoPatch(patch)){
    const d = diffSecao(c[s], patch[s]), ks = Object.keys(d);
    if(!ks.length) continue;
    antes[s] = {}; depois[s] = {};
    for(const k of ks){ antes[s][k] = d[k].de; depois[s][k] = d[k].para; }
  }
  const ev = await novoEvento(c, {em:agora, por:meId, setor:setorAcao || setor || "", codigo:cod, acao:rotulo || "", antes:antes, depois:depois});
  const corpo = Object.assign({}, patch, {atualizadoEm:agora, atualizadoPor:meId, trilha:{[chave()]:ev}});
  if(rotulo) corpo.historico = {[chave()]:{em:agora, por:meId, setor:setorAcao || setor || "", acao:rotulo}};
  await enfileirar(() => db.doc("casos/" + id).update(corpo));
  const fundido = Object.assign({}, c, patch);
  for(const mapa of ["trilha","historico","comentarios","anexos"]) fundido[mapa] = Object.assign({}, c[mapa] || {}, patch[mapa] || {});
  const atualizado = normalizarCaso(fundido);
  casos.set(id, atualizado);
  if(aberto === id) baseEscrita = {id:id, etapa:atualizado.etapa, assinatura:assinatura(atualizado)};
}
function etapaLiberada(s){ const c=casos.get(aberto); if(!c||c.etapa!==s){ toast("Esta etapa não está aberta para edição.",true); return false; } const pa=podeAgir(s); if(!pa.ok){ toast(pa.msg,true); return false; } return true; }

function pedirMotivoVolta(s){
  const box=$("#ac-"+s); const c=casos.get(aberto); if(!box||!c) return;
  const iAt=SECOES.indexOf(c.etapa);

function lerXmlNFe(txt){
  const doc=new DOMParser().parseFromString(txt,"application/xml");
  if(doc.getElementsByTagName("parsererror").length) throw {code:"xml_invalido"};
  const q=(root,tag)=>{ if(!root) return ""; const e=root.getElementsByTagName(tag)[0]; return e?e.textContent.trim():""; };
  const inf=doc.getElementsByTagName("infNFe")[0]; if(!inf) throw {code:"xml_invalido"};
  const ide=inf.getElementsByTagName("ide")[0], dest=inf.getElementsByTagName("dest")[0], ender=dest&&dest.getElementsByTagName("enderDest")[0];
  const tot=inf.getElementsByTagName("ICMSTot")[0];
  const infCpl=q(inf,"infCpl");
  const vend=(infCpl.match(/vend(?:edor|\.)?\s*[:\-]?\s*([A-Za-zÀ-ÿ0-9 .]{2,40})/i)||[])[1];
  return {
    nf:q(ide,"nNF"), serie:q(ide,"serie"),
    chave:((inf.getAttribute("Id")||"").replace(/^NFe/,"")) || q(doc.documentElement,"chNFe"),
    dataEmissao:(q(ide,"dhEmi")||q(ide,"dEmi")).slice(0,10),
    cliente:q(dest,"xNome"), cnpjCpf:q(dest,"CNPJ")||q(dest,"CPF"),
    endereco:[q(ender,"xLgr"),q(ender,"nro"),q(ender,"xCpl"),q(ender,"xBairro")].filter(Boolean).join(", "),
    cidadeUf:[q(ender,"xMun"),q(ender,"UF")].filter(Boolean).join("/"), cep:q(ender,"CEP"),
    valorTotal:parseFloat(q(tot,"vNF"))||null, vendedor:vend?vend.trim():null,
    motorista:((infCpl.match(/motorista\s*:?\s*(?:\d+\s*-\s*)?([A-Za-zÀ-ÿ][A-Za-zÀ-ÿ .']{2,60}?)(?=\s+\d{3}\.|\s+ve[ií]culo|\s*[;|]|$)/i)||[])[1]||"").trim()||null,
    placa:q(inf.getElementsByTagName("veicTransp")[0],"placa") || ((infCpl.match(/ve[ií]culo\s*:?\s*([A-Z]{3}-?\d[A-Z0-9]\d{2})/i)||[])[1]||null),
    pedido:q(inf,"xPed") || ((infCpl.match(/pedido\s*(?:n[º°o.]*)?\s*[:\-]?\s*([A-Za-z0-9\-\/]{2,20})/i)||[])[1]||null),
    duplicatas:[...inf.getElementsByTagName("dup")].map(d=>({numero:q(d,"nDup"), vencimento:q(d,"dVenc"), valor:parseFloat(q(d,"vDup"))||null})),
    itens:[...inf.getElementsByTagName("det")].map(d=>{ const p=d.getElementsByTagName("prod")[0]; return {descricao:q(p,"xProd"), quantidade:parseFloat(q(p,"qCom")), unidade:q(p,"uCom"), valor:parseFloat(q(p,"vProd"))}; })
  };
}
let pdfjsPronto=null;
function carregarScript(src){ return new Promise((ok,falha)=>{ const s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=()=>falha({code:"pdf_lib"}); document.head.appendChild(s); }); }
function carregarPdfJs(){
  if(!pdfjsPronto) pdfjsPronto=(async()=>{ const base="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/"; await carregarScript(base+"pdf.min.js"); await carregarScript(base+"pdf.worker.min.js"); window.pdfjsLib.GlobalWorkerOptions.workerSrc=base+"pdf.worker.min.js"; })();

async function lerPdfNF(file){
  await carregarPdfJs();
  const pdf=await window.pdfjsLib.getDocument({data:await file.arrayBuffer(), isEvalSupported:false}).promise;
  let txt="";
  for(let i=1;i<=Math.min(pdf.numPages,3);i++){ const pg=await pdf.getPage(i); const tc=await pg.getTextContent(); txt+=tc.items.map(it=>it.str+(it.hasEOL?"\n":" ")).join("")+"\n"; }
  if(txt.replace(/\s/g,"").length>200) return await sample.json(PROMPT_NF+"\n\nTexto extraído do PDF da nota:\n\n"+txt.slice(0,40000));
  if(!sampleImgs) throw {code:"images_unavailable"};
  const pg=await pdf.getPage(1); const vp=pg.getViewport({scale:2}); const cv=document.createElement("canvas"); cv.width=vp.width; cv.height=vp.height;
  await pg.render({canvasContext:cv.getContext("2d"), viewport:vp}).promise;
  const blob=await new Promise(r=>cv.toBlob(r,"image/png"));
  return await sample.json(PROMPT_NF+"\n\nA imagem anexa é a primeira página da nota.", {images:[blob]});
}
async function lerImagemNF(file){

const MSG_LEITURA={not_granted:"A leitura automática não foi autorizada. Preencha os campos manualmente.",sampling_disabled:"A leitura automática não está disponível para sua conta.",rate_limited:"Muitas leituras seguidas. Tente de novo em alguns minutos.",image_rejected:"Não consegui abrir a imagem. Use JPG ou PNG.",images_unavailable:"A leitura de foto não está disponível aqui. Anexe o XML ou o PDF da NF.",xml_invalido:"O arquivo XML não parece ser uma NF-e válida.",pdf_lib:"Não foi possível abrir o leitor de PDF. Tente de novo.",sem_leitor:"Leitura automática indisponível. Anexe o XML da NF-e ou preencha manualmente."};
async function onNF(file, alvo){
  alvo=alvo||"logistica";
  if(lendoNF) return;
  if(alvo==="processos"){ if(!etapaLiberada("processos")) return; }
  else if(setor!=="logistica"){ toast("Só a Logística anexa a nota fiscal da devolução.",true); return; }
  lendoNF=true;
  const nome=file.name||"nota";
  const ehXml=/\.xml$/i.test(nome)||/xml/.test(file.type), ehPdf=/\.pdf$/i.test(nome)||file.type==="application/pdf", ehImg=/^image\//.test(file.type);
  statusAnx(ehXml?"Lendo o XML da NF-e…":"O Claude está lendo a nota. Isso leva alguns segundos…","lendo",alvo);
  const envio=subirArquivo(file, alvo==="processos"?"nfnova":"nf");
  let dados=null, erro=null;
  try{
    if(ehXml) dados=lerXmlNFe(await file.text());
    else if(!sample) throw {code:"sem_leitor"};
    else if(ehPdf) dados=await lerPdfNF(file);
    else if(ehImg) dados=await lerImagemNF(file);
    else throw {code:"image_rejected"};
  }catch(e){ erro=MSG_LEITURA[e&&e.code]||"Não consegui ler os dados desta nota. Confira o arquivo ou preencha manualmente."; }
  const a=await envio; if(a && $("#anexos")) await registrarAnexo(a);
  lendoNF=false;
  if(!$("#sec-"+alvo)) return; // ficha fechada no meio da leitura
  if(dados && typeof dados==="object"){
    if(alvo==="processos"){ const r=aplicarNFProcessos(dados); statusAnx(r.n?`${r.n} campos preenchidos a partir da nova NF (em verde). Confira e clique em Salvar rascunho ou Concluir.${r.aviso?" ATENÇÃO: "+r.aviso:""}`:"Não encontrei dados na nota. Preencha manualmente.", r.n&&!r.aviso?"ok":"erro", alvo); }
    else { const n=aplicarDadosNF(dados); statusAnx(n?`${n} campos preenchidos a partir da NF (em verde). Confira e clique em ${aberto==="__novo__"?"Registrar":"Salvar"}.`:"Não encontrei dados na nota. Preencha manualmente.", n?"ok":"erro"); }
  }
  else statusAnx(erro+(a?" O arquivo ficou anexado.":""),"erro",alvo);
}
function aplicarDadosNF(d){
  const s=v=>v==null?"":String(v).trim();
  const num=v=>typeof v==="number"&&isFinite(v)?v:lerMoeda(v);
  const sec=$("#sec-logistica"); if(sec && !sec.open) sec.open=true;
  let n=0;
  const por=(k,v,soVazio)=>{ const el=document.getElementById("f-logistica-"+k); if(!el||v==null||v==="") return; if(soVazio && el.value.trim()) return;
    const f=CAMPOS.logistica.find(x=>x.k===k);
    if(f.t==="money") el.value=fmtNum(v); else el.value=v;
    const c=el.closest(".c"); if(c){ c.classList.add("lido"); c.classList.remove("erro"); } n++; };
  por("nf", s(d.nf).replace(/\D/g,"").replace(/^0+(?=\d)/,""));
  por("serie", s(d.serie));
  por("chave", s(d.chave).replace(/\D/g,""));
  por("dataEmissao", /^\d{4}-\d{2}-\d{2}$/.test(s(d.dataEmissao))?s(d.dataEmissao):"");
  por("cliente", s(d.cliente));
  por("cnpjCliente", s(d.cnpjCpf));
  por("enderecoCliente", [s(d.endereco), d.cep?("CEP "+s(d.cep)):""].filter(Boolean).join(" – "));
  por("cidadeUf", s(d.cidadeUf));
  const vt=num(d.valorTotal); if(vt!=null) por("valorNf", vt);
  if(d.vendedor) por("vendedor", s(d.vendedor), true);
  if(d.motorista) por("motorista", s(d.motorista), true);
  if(d.placa) por("placa", s(d.placa).toUpperCase().replace(/[^A-Z0-9]/g,""), true);
  const tipo=document.getElementById("f-logistica-tipo");
  if(vt!=null && (!tipo || tipo.value!=="Parcial")) por("valor", vt, true);
  if(Array.isArray(d.itens) && d.itens.length){
    const linhas=d.itens.slice(0,60).map(it=>{ const q=num(it&&it.quantidade); return `${q!=null?q.toLocaleString("pt-BR"):""} ${s(it&&it.unidade)} – ${s(it&&it.descricao)}${num(it&&it.valor)!=null?" ("+fmtMoeda(num(it.valor))+")":""}`.trim(); });
    por("itens", linhas.join("\n"), true);
  }
  if(n){ sujo.logistica=true; atualizarEmail(); }
  return n;
}

function classificarTexto(t){
  if(/DANFE|DOCUMENTO AUXILIAR DA NOTA|CHAVE DE ACESSO/i.test(t)) return "nf";
  if(/linha digit|nosso n.mero|benefici.rio|cedente|ficha de compensa|autentica..o mec/i.test(t)) return "boleto";

async function lerDocProcessos(file){
  const nome=file.name||"";
  if(/\.xml$/i.test(nome)||/xml/.test(file.type)) return {tipo:"nf", dados:lerXmlNFe(await file.text())};
  if(!sample) throw {code:"sem_leitor"};
  const qual=async(prompt,opts)=>{ const r=await sample.json(prompt,opts); if(r&&r.tipo==="boleto") return {tipo:"boleto",dados:r.boleto}; return {tipo:r&&r.tipo==="nf"?"nf":null, dados:r&&r.nf}; };

  const O=lerSecao("ocorrencia"); const to=lerEmails(O.destinatarios);
  if(!O.numero){ marcarErros("ocorrencia",CAMPOS.ocorrencia.filter(f=>f.k==="numero")); toast("Informe o nº da ocorrência antes de preparar o e-mail.",true); return; }
  if(!validarDestinos(to,[])){ marcarErros("ocorrencia",CAMPOS.ocorrencia.filter(f=>f.k==="destinatarios")); return; }
  const c=casos.get(aberto); const lista=anexosEscolhidos("oco");
  const linhas=textoEmail().split("\n"); const subject=linhas[0].replace(/^Assunto:\s*/,"").slice(0,250);
  let body=linhas.slice(1).join("\n").replace(/^\n+/,"");
  if(lista.length) body=body.replace(/\nAtenciosamente,\s*$/, `\nAnexos: ${lista.map(a=>a.nome||rotuloAnexo(a.tipo)).join(", ")}\n\nAtenciosamente,`);
  const b=$("#rasc-oco"), info=$("#oco-info"); enviando=true; b.disabled=true;
  try{
    if(lista.length){ info.className="sub"; info.textContent="Baixando os anexos…"; }
    const baixou=await baixarAnexos(lista, `${c.codigo||"devolucao"}_ocorrencia`);
    info.className="sub"; info.textContent="Criando o e-mail no Outlook…";
    const res=await mcp.callTool(M365,"outlook_create_draft",{to, subject, body, bodyType:"text"});
    const link=res&&res.payload&&(res.payload.webLink||res.payload.weblink);
    const passo={link, anexos:lista.length, baixou}; ultimoRascunho[aberto]=Object.assign(ultimoRascunho[aberto]||{}, {oco:passo});
    mostrarPasso(info, passo);
    toast('E-mail pronto no Outlook. Depois de enviar, marque "E-mail da ocorrência enviado".');
    try{ await gravar({ocorrencia:lerSecao("ocorrencia")}, `E-mail da ocorrência ${O.numero} preparado no Outlook para ${to.join(", ")}${lista.length?" com "+lista.length+" anexo(s)":""}`, "ocorrencia", "email"); sujo.ocorrencia=false; }catch(e){ tratarErro(e); }
  }catch(e){ toast(msgMcp(e),true); info.textContent=""; }
  finally{ enviando=false; b.disabled=false; }
}
async function enviarOcorrencia(){
  if(!etapaLiberada("ocorrencia")||enviando) return;
  if(!mcp){ toast(MSG_MCP.not_granted,true); return; }
  const O=lerSecao("ocorrencia"); const to=lerEmails(O.destinatarios);
  if(!O.numero){ marcarErros("ocorrencia",CAMPOS.ocorrencia.filter(f=>f.k==="numero")); toast("Informe o nº da ocorrência antes de enviar.",true); return; }
  if(!validarDestinos(to,[])){ marcarErros("ocorrencia",CAMPOS.ocorrencia.filter(f=>f.k==="destinatarios")); return; }
  const linhas=textoEmail().split("\n"); const subject=linhas[0].replace(/^Assunto:\s*/,"").slice(0,250); const body=linhas.slice(1).join("\n").replace(/^\n+/,"");
  const b=$("#enviar-oco"); enviando=true; b.disabled=true; b.textContent="Enviando…";

/* ---------- E-mail da ocorrência ---------- */
function textoEmail(){
  const c=casos.get(aberto)||{};
  const L=Object.assign({},c.logistica,lerSecao("logistica")), C=Object.assign({},c.comercial,lerSecao("comercial")), O=Object.assign({},c.ocorrencia,lerSecao("ocorrencia"));
  const v=(x)=>x==null||x===""?"—":x;
  const linhas=[
    `Assunto: Ocorrência ${O.numero||"[nº]"} – Devolução NF ${L.nf||"[NF]"} – ${L.cliente||"[cliente]"}`,"",
    "Prezados,","","Segue abertura de ocorrência referente à devolução abaixo.","",
    "DEVOLUÇÃO",
    `Nota fiscal: ${v(L.nf)}${L.serie?" série "+L.serie:""}${L.dataEmissao?" – emitida em "+fmtData(L.dataEmissao):""}`,
    `Chave de acesso: ${v(L.chave)}`,`Valor total da NF: ${v(fmtMoeda(L.valorNf))}`,
    `Cliente: ${v(L.cliente)}${L.codCliente?" (cód. "+L.codCliente+")":""}`,`CNPJ/CPF: ${v(L.cnpjCliente)}`,
    `Endereço: ${v([L.enderecoCliente,L.cidadeUf].filter(Boolean).join(" – "))}`,`Vendedor: ${v(L.vendedor)}`,
    `Data da devolução: ${v(fmtData(L.dataDevolucao))}`,`Motorista: ${v([L.motorista,L.placa].filter(Boolean).join(" / "))}`,
    `Motivo: ${v(L.motivo)}`,`Relato do motorista: ${v(L.motivoDetalhe)}`,`Tipo: ${v(L.tipo)}`,`Valor devolvido: ${v(fmtMoeda(L.valor))}`,
    `Produtos devolvidos:\n${v(L.itens)}`,"",
    "TRATATIVA COMERCIAL",`Destino da mercadoria: ${v(C.decisao)}`];
  if(C.decisao===REVENDA){ linhas.push(`Novo cliente: ${v(C.novoCliente)}${C.codNovoCliente?" (cód. "+C.codNovoCliente+")":""}`,`Vendedor da revenda: ${v(C.novoVendedor)}`,`Valor da revenda: ${v(fmtMoeda(C.preco))}`,`Condição de pagamento: ${v(C.condPagamento)}`,`Endereço de entrega: ${v(C.endereco)}`,`Previsão de entrega: ${v(fmtData(C.previsao))}`); }
  if(C.obs) linhas.push(`Observações: ${C.obs}`);
  const fotos=Object.values(c.anexos||{}).filter(a=>a&&a.tipo==="foto").length;
  linhas.push("",`Nº da ocorrência: ${v(O.numero)}`,`Registro no painel: ${c.codigo||""}${fotos?` (${fotos} foto${fotos>1?"s":""} anexada${fotos>1?"s":""} no painel)`:""}`,"","Atenciosamente,");
  return linhas.join("\n");
}
function atualizarEmail(){ const t=$("#email-txt"); if(t) t.value=textoEmail(); atualizarResumo(); }
async function copiarEmail(){
  const t=$("#email-txt"); try{ await navigator.clipboard.writeText(t.value); toast("E-mail copiado. Cole no Outlook."); }
  catch(e){ t.focus(); t.select(); toast("Texto selecionado. Use Ctrl+C para copiar."); }
}
async function copiarTabela(){
  const cols = visao === "fim" ? COLS_FIM : visao === "acomp" ? COLS_ACOMP : COLS_LISTA;
  const rows = visao === "fim" ? linhasFim() : visao === "acomp" ? linhasAcomp() : linhasLista();
  const tsv=[cols.map(c=>c[0]).join("\t"), ...rows.map(c=>cols.map(col=>String(col[1](c)||"").replace(/[\t\n\r]+/g," ")).join("\t"))].join("\n");
  try{ await navigator.clipboard.writeText(tsv); toast(`${rows.length} linhas copiadas. Cole no Excel.`); }catch(e){ toast("Não foi possível copiar neste navegador.",true); }
}

/* ---------- Avisos de mudanças de outras pessoas ---------- */
function avisarMudanca(c){
  const hist=Object.values(c.historico||{}).filter(Boolean).sort((a,b)=>String(b.em).localeCompare(String(a.em)))[0];
  const coms=Object.values(c.comentarios||{}).filter(Boolean).sort((a,b)=>String(b.em).localeCompare(String(a.em)))[0];
  let txt, quem;
  if(coms && (!hist || String(coms.em)>String(hist.em))){ quem=coms.por; txt=`comentou em ${c.codigo}: “${String(coms.texto).slice(0,80)}”`; }
  else if(hist){ quem=hist.por; txt=`${c.codigo}: ${hist.acao}`; }
  else return;
  const span=document.createElement("span"); span.innerHTML=`<b>${pessoa(quem)}</b> `; span.appendChild(document.createTextNode(txt));
  toast(span); resolverNomes(span);
}

/* ---------- Painel de Acessos ---------- */
function abrirAcessos(){
  if(!meuAcesso.gestor) return toast("Só gestores administram acessos.", true);
  abrirFicha("__acessos__");
}

async function pedirAcesso(){
  if(!db || !meId) return;
  if(acessos.has(meId)){ toast("Seu pedido já está registrado. Aguarde a liberação.", true); return; }
  try{
    await db.doc("acessos/"+meId).set({nome:meNome||"", setores:[], papel:"membro", status:"pendente", em:agoraISO(), por:meId});
    toast("Pedido enviado. Um gestor libera seu setor na tela Acessos.");
  }catch(e){ toast("Não consegui registrar o pedido. Peça ao responsável pelo painel.", true); }
}

async function reivindicarAdmin(){
  if(!db || !meId || acessos.size) return;
  const ev={em:agoraISO(), por:meId, acao:"Administração assumida no primeiro acesso", de:[], para:SECOES.slice()};
  try{
    await db.doc("acessos/"+meId).set({nome:meNome||"", setores:SECOES.slice(), papel:"dono", status:"ativo", em:ev.em, por:meId, log:{[chave()]:ev}});
    toast("Você é o administrador do painel. Libere o acesso de cada setor em Acessos.");
  }catch(e){ tratarErro(e); }
}

async function salvarAcesso(uid, mudanca, acao){
  if(!meuAcesso.gestor) return toast("Só gestores alteram acessos.", true);
  const atual=acessos.get(uid)||{};
  if(atual.papel==="dono" && mudanca.papel && mudanca.papel!=="dono") return toast("O dono do painel só muda pelo código.", true);
  const depois=Object.assign({}, atual, mudanca);
  let gestores=0;
  for(const [id,d] of acessos.entries()){
    const p = id===uid ? (depois.papel||"membro") : (d.papel||"membro");
    if(p==="gestor"||p==="dono") gestores++;
  }
  if(!gestores) return toast("O painel precisa de pelo menos um gestor ativo.", true);
  const ev={em:agoraISO(), por:meId, acao:acao||"Acesso alterado", de:atual.setores||[], para:depois.setores||[]};
  const ref=db.doc("acessos/"+uid);
  try{
    if(acessos.has(uid)) await ref.update(Object.assign({}, mudanca, {em:ev.em, por:meId, log:{[chave()]:ev}}));
    else await ref.set(Object.assign({}, depois, {em:ev.em, por:meId, log:{[chave()]:ev}}));
    toast("Acesso atualizado.");
  }catch(e){ tratarErro(e); }
}

async function salvarPrazos(){
  if(!meuAcesso.gestor){ toast("Só gestores alteram prazos.", true); return; }
  const novos = {};
  for(const s of SECOES){
    const el = document.getElementById("pz-" + s);
    const v = el ? Number(el.value) : 0;
    novos[s] = isFinite(v) && v > 0 ? v : 0;
  }
  try{
    await db.doc("config/painel").set({prazos:novos, em:agoraISO(), por:meId});
    for(const s of SECOES) prazos[s] = novos[s];
    toast("Prazos atualizados.");
  }catch(e){ tratarErro(e); }
}
function montarAcessos(){
  const todos=[...acessos.entries()].sort((a,b)=>{
    const pa=(a[1].setores||[]).length?1:0, pb=(b[1].setores||[]).length?1:0;
    if(pa!==pb) return pa-pb;
    return String(a[1].nome||"").localeCompare(String(b[1].nome||""));
  });
  const pendentes=todos.filter(([,d])=>!(d.setores||[]).length);
  const ativos=todos.filter(([,d])=>(d.setores||[]).length);
  const linha=([uid,d])=>{
    const papel = d.papel==="dono" ? `<span class="pill ok">dono</span>` : d.papel==="gestor" ? `<span class="pill">gestor</span>` : "";
    const pend = (d.setores||[]).length ? "" : `<span class="pill warn">aguardando liberação</span>`;
    return `<div class="acx">
    <div class="l1"><b>${esc(d.nome||"(sem nome)")}</b>
      <span class="ids mono">${esc(String(uid).slice(0,10))}…</span>
      ${papel}${pend}
      <span class="espaco"></span>
      <span class="pe">${esc(fmtQuando(d.em))}${d.por?" por "+pessoa(d.por):""}</span>
    </div>
    <div class="setores">
      ${SECOES.map(s=>`<label class="chk-mini"><input type="checkbox" data-acao="setor" data-alvo="${esc(uid)}" data-setor="${s}"${(d.setores||[]).includes(s)?" checked":""}> ${ROTULO_SETOR[s]}</label>`).join("")}
      <label class="chk-mini"><input type="checkbox" data-acao="gestor" data-alvo="${esc(uid)}"${d.papel==="gestor"||d.papel==="dono"?" checked":""}${d.papel==="dono"?" disabled":""}> gestor</label>
    </div>
  </div>`;
  };
  $("#ficha").innerHTML=`
  <div class="f-cab"><div class="l1"><div><h2>Acessos</h2>
    <div class="sub">Cada pessoa só edita o setor liberado abaixo. Seu id: <span class="mono">${esc(meId||"—")}</span></div></div>
    <button class="fechar" type="button" aria-label="Fechar">×</button></div></div>
  <div class="f-corpo">
    <div class="bloco"><h3>Pedidos e equipe</h3>
      ${pendentes.length?`<div class="grupo">Aguardando liberação</div>${pendentes.map(linha).join("")}`:""}
      ${ativos.length?`<div class="grupo">Com acesso</div>${ativos.map(linha).join("")}`:""}
      ${!todos.length?`<div class="vazio">Ninguém abriu o painel ainda.</div>`:""}
    </div>
    <div class="bloco"><h3>Liberar alguém pelo id</h3>
      <div class="anx-botoes"><input type="text" id="acx-uid" placeholder="id do usuário" style="flex:1 1 240px;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:7px 9px">
      <button class="btn" type="button" id="acx-add">Adicionar</button></div>
      <div class="aviso-fut">O id de cada pessoa aparece no topo desta tela quando ela abre o painel.</div>
    </div>
    <div class="bloco"><h3>Prazo por etapa (dias)</h3>
      <div class="anx-botoes">
        ${SECOES.map(s => `<label class="campo-topo" for="pz-${s}">${ET[s].nome}<input type="number" id="pz-${s}" min="0" max="90" step="1" value="${Number(prazos[s]) || 0}" style="width:72px;background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:6px 8px"></label>`).join("")}
        <button class="btn pri" type="button" id="pz-ok">Salvar prazos</button>
      </div>
      <div class="aviso-fut">O prazo conta a partir da entrada atual na etapa. Zero desliga o prazo da etapa.</div>
    </div>
  </div>`;
  resolverNomes($("#ficha"));
  const pz=$("#pz-ok"); if(pz) pz.onclick=salvarPrazos;
  const add=$("#acx-add");
  if(add) add.onclick=()=>{
    const el=$("#acx-uid"); const uid=el?el.value.trim():"";
    if(!uid) return toast("Informe o id de quem vai receber acesso.", true);
    if(acessos.has(uid)) return toast("Essa pessoa já tem registro. Ajuste os setores na lista acima.", true);
    salvarAcesso(uid, {nome:"", setores:[], papel:"membro", status:"pendente"}, "Usuário pré-cadastrado por id");
  };
  $("#ficha").onchange=ev=>{
    const cb=ev.target.closest("input[data-acao]"); if(!cb) return;
    const uid=cb.dataset.alvo, d=acessos.get(uid)||{};
    if(cb.dataset.acao==="setor"){
      const set=new Set(d.setores||[]);
      if(cb.checked) set.add(cb.dataset.setor); else set.delete(cb.dataset.setor);
      const lista=[...set];
      salvarAcesso(uid, {setores:lista, status:lista.length?"ativo":"pendente"}, "Setores de "+(d.nome||uid)+": "+(lista.map(s=>ROTULO_SETOR[s]).join(", ")||"nenhum"));
    } else {
      salvarAcesso(uid, {papel:cb.checked?"gestor":"membro"}, (d.nome||uid)+(cb.checked?" agora é gestor":" deixou de ser gestor"));
    }
  };
}
/* ---------- Eventos de interface ---------- */
$("#setor").value=setor;
$("#setor").onchange=e=>{ setor=e.target.value; lsSet("dev-setor",setor); render();
  if(aberto==="__novo__" && setor!=="logistica"){ sujo={}; fecharFicha(); }
  else if(aberto && $("#f-cab")) atualizarFicha(false); };
let buscaTimer=null;
$("#busca").oninput=e=>{ busca=e.target.value; clearTimeout(buscaTimer); buscaTimer=setTimeout(render, 220); };
$("#v-quadro").onclick=()=>trocarVisao("quadro");
$("#v-lista").onclick=()=>trocarVisao("lista");
$("#v-acomp").onclick=()=>trocarVisao("acomp");
$("#v-fim").onclick=()=>trocarVisao("fim");
$("#fim-periodo").onchange=e=>{ periodoFim=Number(e.target.value)||0; if(visao==="fim") renderFinalizados(); };
$("#f-etapa").onchange=e=>{ filtroEtapa=e.target.value||""; if(visao==="acomp") renderAcompanhamento(); };

const abt=$("#acessos-bt"); if(abt) abt.onclick=abrirAcessos;
$("#novo").onclick=()=>{ if(!db){ toast("Abra o painel pelo claude.ai para registrar casos.",true); return; } if(!podeEscrever){ toast("Seu acesso é só de leitura.",true); return; } abrirFicha("__novo__"); };
$("#quadro").addEventListener("click",e=>{ const b=e.target.closest(".cartao"); if(b) abrirFicha(b.dataset.id); });
["#lista","#acomp","#fim"].forEach(sel=>{ const el=$(sel); if(el) el.addEventListener("click",e=>{ const r=e.target.closest("tr[data-id]"); if(r) abrirFicha(r.dataset.id); }); });
$("#veu").onclick=fecharFicha;
$("#ficha").addEventListener("click",e=>{ if(e.target.closest(".fechar")) fecharFicha(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && aberto) fecharFicha(); });
setInterval(()=>{ if(carregado && !Object.values(sujo||{}).some(Boolean)) render(); }, 60000); // atualiza contagem de dias

/* ---------- Conexão ---------- */
render();
(async()=>{
  if(MODO_DEMO) avisoModoDemo();
  try{ user=await RT.use("user"); }catch(e){ user=null; }
  if(user){
    try{ const me=await user.me(); meId=me.id; meNome=me.name||""; souEditor=!!me.canEdit; $("#eu").textContent="Verificando acesso…"; }catch(e){}
    try{ const p=await user.can("data.write"); if(p===false){ podeEscrever=false; $("#novo").disabled=true; const fx=$("#faixa"); fx.textContent="Seu acesso a este painel é só de leitura. Para registrar e atualizar casos, peça ao responsável acesso de Colaborador."; fx.classList.add("on"); } }catch(e){}
  }
  RT.use("downloads").then(d=>{ downloads=d||null; }).catch(()=>{});
  RT.use("mcp").then(m=>{ mcp=m||null; if(aberto && $("#f-cab")) atualizarFicha(false); }).catch(()=>{});
  RT.use("assets").then(a=>{ assets=a||null; if(aberto) renderAnexos(); }).catch(()=>{});
  RT.use("sample").then(async s=>{ sample=s||null; if(sample){ try{ const lim=await sample.limits(); sampleImgs=!!(lim&&lim.images); }catch(e){} } }).catch(()=>{});
  try{ db=await RT.use("db"); }catch(e){ db=null; }
  if(!db){ $("#vivo").className="vivo erro"; $("#vivo-txt").textContent="Sem conexão"; const fx=$("#faixa"); fx.textContent="Não foi possível acessar os dados compartilhados. Abra o painel pelo claude.ai com sua conta da empresa."; fx.classList.add("on"); acessoPronto=true; calcularAcesso(); carregado=true; render(); return; }
  try{
    db.collection("acessos").onSnapshot(snap=>{
      acessos.clear();
      for(const d of snap.docs){ const v=d.data(); if(v) acessos.set(d.id,v); }
      acessoPronto=true;
      calcularAcesso();
      if(aberto==="__acessos__") montarAcessos();
      else if(aberto && aberto!=="__novo__" && casos.has(aberto) && $("#f-cab")) atualizarFicha(false);
    }, ()=>{ acessoPronto=true; calcularAcesso(); });
  }catch(e){ acessoPronto=true; calcularAcesso(); }
  try{
    db.collection("config").onSnapshot(snap=>{
      const d = snap.docs.filter(x => x.id === "painel")[0];
      const p = d && d.data() ? d.data().prazos : null;
      if(p){ for(const s of SECOES){ const n = Number(p[s]); if(isFinite(n)) prazos[s] = n; } }
      if(carregado) render();
      if(aberto && $("#f-cab")) atualizarFicha(false);
    }, ()=>{});
  }catch(e){}
  const timer=setTimeout(()=>{ if(!carregado){ $("#vivo").className="vivo erro"; $("#vivo-txt").textContent="Sem resposta"; const fx=$("#faixa"); fx.textContent="Os dados ainda não chegaram. Verifique sua conexão; o painel continua tentando."; fx.classList.add("on"); } },10000);
  db.collection("casos").onSnapshot(snap=>{
    const avisos=[];
    if(!primeiroSnap){ for(const ch of snap.docChanges()){ if(ch.type==="removed") continue; const d=ch.doc.data(); if(d && !ch.doc.metadata.hasPendingWrites && d.atualizadoPor && d.atualizadoPor!==meId) avisos.push(d); } }
    casos.clear(); for(const d of snap.docs){ const v=d.data(); if(v) casos.set(d.id, normalizarCaso(v)); }
    if(!snap.metadata.fromCache){ clearTimeout(timer); carregado=true; primeiroSnap=false; $("#vivo").className="vivo on"; $("#vivo-txt").textContent="Ao vivo"; const fx=$("#faixa"); if(fx.textContent.startsWith("Os dados")) fx.classList.remove("on"); }
    else if(casos.size) carregado=true;
    render();
    if(aberto && aberto!=="__novo__" && casos.has(aberto)){ if($("#f-cab")) atualizarFicha(false); else montarFicha(); }
    avisos.slice(0,3).forEach(avisarMudanca);
  }, err=>{
    clearTimeout(timer); carregado=true; $("#vivo").className="vivo erro"; $("#vivo-txt").textContent="Desconectado";
    const fx=$("#faixa"); fx.textContent = err&&err.code==="revoked" ? "O acesso a este painel mudou. Recarregue a página." : "A conexão com os dados caiu. Recarregue a página para reconectar."; fx.classList.add("on"); render();
  });
})();
